name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Build exe
        shell: pwsh
        run: pyinstaller --clean --noconfirm tiktok_telegram_downloader.spec

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = ".\dist\tiktok-telegram-downloader.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tiktok-telegram-downloader.exe" | Set-Content ".\dist\sha256.txt" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-telegram-downloader-windows
          path: |
            dist/tiktok-telegram-downloader.exe
            dist/sha256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tiktok-telegram-downloader.exe
            dist/sha256.txt
