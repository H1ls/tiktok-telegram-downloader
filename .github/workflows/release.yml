name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          @'
          import os
          import sys
          from core.version import CURRENT_VERSION
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if tag_version != CURRENT_VERSION:
              sys.exit(f"Release tag {tag_version} does not match CURRENT_VERSION {CURRENT_VERSION}")
          '@ | python -

      - name: Build exe
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm tiktok_telegram_downloader.spec

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = ".\dist\tiktok-telegram-downloader.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  tiktok-telegram-downloader.exe" | Set-Content ".\dist\sha256.txt" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-telegram-downloader-windows
          if-no-files-found: error
          path: |
            dist/tiktok-telegram-downloader.exe
            dist/sha256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tiktok-telegram-downloader.exe
            dist/sha256.txt
